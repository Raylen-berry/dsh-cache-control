name: CI

# 发布前检查：push / PR 都跑同一套离线测试，任一环节非 0 退出即整体失败。
#
# 为什么是 windows-latest：这 7 个插件跑在 Windows 上的 DSH Desktop 里，7 套件也都在
#   Windows 上实测通过（本机无 WSL 发行版，Linux/macOS 未实测 ⇒ 不放进 CI 冒红）。
# 为什么是 20/22/24 矩阵：仓库都没写 engines（只有 codex 写了 >=20），所以按
#   20 = 最老仍常见的 LTS、22 = 当前 LTS、24 = DSH Desktop 实际内置的运行时
#   （本机 DSH 自带的 node 就是 v24.9.0）三个都测；三档已用**独立下载的** node 在
#   干净环境（DSH_HOME/APPDATA/DSH_APP_MODULES 全指空目录）逐套实测通过。
#
# 全程不联网跑测试：不起真浏览器、不做真实下载、不调真实模型。
# 需要这些或需要本机 DSH 安装目录 / 真实媒体盘的套件已排除，清单与原因见
#   tools/run-all.mjs 的 EXCLUDED（`node tools/run-all.mjs --list` 可打印）。
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # npm test = node tools/run-all.mjs：每套都跑完再汇总，任一套失败 ⇒ 退出码 1。
      # 本仓库测试不需要任何依赖，所以没有 npm install 这一步（离线可跑）。
      - run: npm test
